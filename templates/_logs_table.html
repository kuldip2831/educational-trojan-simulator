<div class="table-tools">
    <input class="table-search" type="search" placeholder="Search activity" data-table-filter>
</div>
<table class="data-table" data-filterable>
    <thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Target</th><th>Status</th><th>Detection</th></tr></thead>
    <tbody>
    {% for log in logs %}
    <tr>
        <td>{{ log.created_at }}</td><td>{{ log.email or "local" }}</td><td>{{ log.action }}</td><td>{{ log.target }}</td>
        <td><span class="badge badge-{{ log.status|lower|replace(' ', '-') }}">{{ log.status }}</span></td><td>{{ log.detection_result }}</td>
    </tr>
    {% else %}<tr><td colspan="6" class="empty">No activity yet.</td></tr>{% endfor %}
    </tbody>
</table>
